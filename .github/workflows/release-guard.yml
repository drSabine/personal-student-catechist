# main is production (Vercel deploys it). Only staging may be merged into main.
# Mark "Only staging into main" as a required check for main (see docs/workflow.md).
name: Release guard

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  from-staging:
    name: Only staging into main
    runs-on: ubuntu-latest
    steps:
      - name: Check the source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "staging" ]; then
            echo "::error::Pull requests into main must come from staging, not '$HEAD_REF'. Open this pull request against staging instead."
            exit 1
          fi
          echo "Source branch is staging."
